<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 1 | Javascript Calculando el total</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <section>
        <div class="card">
            <div class="img-card">
            </div>
            <h6>Laptop Gamer AMD</h6>
            <p>Precio base: $<span class="precio-inicial"></span> </p>

            <p id="textoCantidad">Cantidad:
                <span class="cantidad">0</span>

                <button onclick="cantidad = cantidad + 1;
                                 document.querySelector('.cantidad').innerHTML = cantidad;
                                 document.querySelector('.valor-total').innerHTML = cantidad * precio;
                ">
                    +
                </button>

                <button onclick="cantidad = cantidad - 1;
                                 document.querySelector('.cantidad').innerHTML = cantidad;
                                 document.querySelector('.valor-total').innerHTML = cantidad * precio;
                ">
                    -
                </button>
            </p>
        </div>
    </section> 

    <div class="total-section">
        <p>Total a pagar: $<span class="valor-total">0</span> </p>
    </div>

    <script src="./assets/js/script.js"></script>
</body>

</html>
